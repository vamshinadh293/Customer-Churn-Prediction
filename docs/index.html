<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Churn Prediction</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="container">

        <h1>Customer Churn Prediction</h1>

        <p class="subtitle">
            XGBoost-powered customer retention risk analysis
        </p>

        <form id="churnForm">

            <div class="form-grid">

                <div>
                    <label>Gender</label>
                    <select id="gender">
                        <option>Male</option>
                        <option>Female</option>
                    </select>
                </div>

                <div>
                    <label>Senior Citizen</label>
                    <select id="SeniorCitizen">
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                    </select>
                </div>

                <div>
                    <label>Partner</label>
                    <select id="Partner">
                        <option>No</option>
                        <option>Yes</option>
                    </select>
                </div>

                <div>
                    <label>Dependents</label>
                    <select id="Dependents">
                        <option>No</option>
                        <option>Yes</option>
                    </select>
                </div>

                <div>
                    <label>Tenure (months)</label>
                    <input
                        type="number"
                        id="tenure"
                        min="0"
                        max="72"
                        value="6"
                        required
                    >
                </div>

                <div>
                    <label>Phone Service</label>
                    <select id="PhoneService">
                        <option>Yes</option>
                        <option>No</option>
                    </select>
                </div>

                <div>
                    <label>Multiple Lines</label>
                    <select id="MultipleLines">
                        <option>No</option>
                        <option>Yes</option>
                        <option>No phone service</option>
                    </select>
                </div>

                <div>
                    <label>Internet Service</label>
                    <select id="InternetService">
                        <option>DSL</option>
                        <option>Fiber optic</option>
                        <option>No</option>
                    </select>
                </div>

                <div>
                    <label>Online Security</label>
                    <select id="OnlineSecurity">
                        <option>No</option>
                        <option>Yes</option>
                        <option>No internet service</option>
                    </select>
                </div>

                <div>
                    <label>Online Backup</label>
                    <select id="OnlineBackup">
                        <option>No</option>
                        <option>Yes</option>
                        <option>No internet service</option>
                    </select>
                </div>

                <div>
                    <label>Device Protection</label>
                    <select id="DeviceProtection">
                        <option>No</option>
                        <option>Yes</option>
                        <option>No internet service</option>
                    </select>
                </div>

                <div>
                    <label>Tech Support</label>
                    <select id="TechSupport">
                        <option>No</option>
                        <option>Yes</option>
                        <option>No internet service</option>
                    </select>
                </div>

                <div>
                    <label>Streaming TV</label>
                    <select id="StreamingTV">
                        <option>No</option>
                        <option>Yes</option>
                        <option>No internet service</option>
                    </select>
                </div>

                <div>
                    <label>Streaming Movies</label>
                    <select id="StreamingMovies">
                        <option>No</option>
                        <option>Yes</option>
                        <option>No internet service</option>
                    </select>
                </div>

                <div>
                    <label>Contract</label>
                    <select id="Contract">
                        <option>Month-to-month</option>
                        <option>One year</option>
                        <option>Two year</option>
                    </select>
                </div>

                <div>
                    <label>Paperless Billing</label>
                    <select id="PaperlessBilling">
                        <option>Yes</option>
                        <option>No</option>
                    </select>
                </div>

                <div>
                    <label>Payment Method</label>
                    <select id="PaymentMethod">
                        <option>Electronic check</option>
                        <option>Mailed check</option>
                        <option>Bank transfer (automatic)</option>
                        <option>Credit card (automatic)</option>
                    </select>
                </div>

                <div>
                    <label>Monthly Charges</label>
                    <input
                        type="number"
                        id="MonthlyCharges"
                        step="0.01"
                        value="70.70"
                        required
                    >
                </div>

                <div>
                    <label>Total Charges</label>
                    <input
                        type="number"
                        id="TotalCharges"
                        step="0.01"
                        value="424.20"
                        required
                    >
                </div>

            </div>

            <button type="submit">
                Predict Churn Risk
            </button>

        </form>

        <div id="result" class="result hidden">

            <div class="result-item">
                <span>Churn Probability</span>
                <strong id="probability">--</strong>
            </div>

            <div class="result-item">
                <span>Decision Threshold</span>
                <strong id="threshold">--</strong>
            </div>

            <div class="result-item">
                <span>Prediction</span>
                <strong id="prediction">--</strong>
            </div>

        </div>

    </div>

    <script src="/static/script.js"></script>

</body>
</html>
